[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[project]
name = "faststream-mq"
description = "Standalone IBM MQ adapter for FastStream"
readme = "README.md"
authors = [{ name = "David Zuckerman" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
version = "0.1.0"
keywords = ["faststream", "ibm-mq", "mq", "message-broker", "asyncapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Typing :: Typed",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "faststream>=0.7.0rc1,<0.8",
    "ibmmq>=2,<3; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'amd64') or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'win32' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'amd64')",
    "cryptography>=46,<47",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.128.0", "starlette"]
otel = ["opentelemetry-sdk>=1.24.0,<2.0.0"]
prometheus = ["prometheus-client>=0.20.0,<0.30.0"]
all = [
    "fastapi>=0.128.0",
    "starlette",
    "opentelemetry-sdk>=1.24.0,<2.0.0",
    "prometheus-client>=0.20.0,<0.30.0",
]

[project.urls]
Homepage = "https://github.com/davzucky/faststream-mq"
Source = "https://github.com/davzucky/faststream-mq"
Tracker = "https://github.com/davzucky/faststream-mq/issues"

[dependency-groups]
test = [
    "dirty-equals==0.11",
    "email-validator==2.3.0",
    "freezegun>=1.5.5",
    "httpx==0.28.1",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov>=6.2.1",
    "pytest-rerunfailures>=15.1",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "PyYAML==6.0.3",
    "typer>=0.9,!=0.12,<=0.21.1",
]
lint = [
    "prek>=0.2.0",
    "ruff==0.14.14",
    "ty>=0.0.1a23",
]
docs = [
    "mkdocs-material>=9.7.1,<10",
    "mdx-include>=1.4.2,<2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv.build-backend]
module-root = "."
module-name = "faststream_mq"

[tool.pytest.ini_options]
minversion = "9.0"
timeout = 30
addopts = "--strict-markers --strict-config -q -m 'not slow'"
testpaths = ["tests"]
markers = [
    "mq",
    "connected",
    "slow",
    "all",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["faststream_mq"]
branch = true

[tool.ty.src]
include = ["faststream_mq", "tests/typing"]
