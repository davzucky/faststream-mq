services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace/faststream-mq:cached
    working_dir: /workspace/faststream-mq
    network_mode: host
    environment:
      UV_PROJECT_ENVIRONMENT: /workspace/faststream-mq/.venv
      MQ_FILE_PATH: /opt/mqm
      LD_LIBRARY_PATH: /opt/mqm/lib64
    depends_on:
      ibmmq:
        condition: service_healthy
      ibmmq_ha2:
        condition: service_started

  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    ports:
      - "1414:1414"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: password
      MQ_ADMIN_PASSWORD: password
      MQ_ENABLE_EMBEDDED_WEB_SERVER: "false"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo 'DISPLAY QMGR' | runmqsc QM1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ibmmq_ha2:
    image: icr.io/ibm-messaging/mq:latest
    ports:
      - "1415:1414"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: password
      MQ_ADMIN_PASSWORD: password
      MQ_ENABLE_EMBEDDED_WEB_SERVER: "false"
    security_opt:
      - no-new-privileges:true
