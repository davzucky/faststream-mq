name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install IBM MQ client SDK
        run: sudo ./scripts/install-mq-client.sh
      - name: Install dependencies
        run: uv sync --all-extras --group dev
        env:
          MQ_FILE_PATH: /opt/mqm
          LD_LIBRARY_PATH: /opt/mqm/lib64
      - name: Ruff format
        run: uv run ruff format --check
      - name: Ruff check
        run: uv run ruff check
      - name: Type check
        run: ./scripts/ty-check.sh
      - name: Tests without connected broker
        run: uv run pytest -m 'not connected and not slow'

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install docs dependencies
        run: uv sync --only-group docs
      - name: Build docs
        run: uv run --only-group docs mkdocs build --strict

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install IBM MQ client SDK
        run: sudo ./scripts/install-mq-client.sh
      - run: uv build
        env:
          MQ_FILE_PATH: /opt/mqm
          LD_LIBRARY_PATH: /opt/mqm/lib64
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
